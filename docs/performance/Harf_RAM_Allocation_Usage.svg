<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" font-family="Arial, sans-serif"><title>Harf RAM allocations and measured usage</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#9B7380"/></marker></defs><rect width="1600" height="1150" fill="#F5F6F8"/><text x="60" y="74.0" font-size="32.480000000000004" fill="#A51E37" font-weight="bold">Harf RAM allocations and usage</text><text x="62" y="112.0" font-size="14.560000000000002" fill="#627084" font-weight="normal">Local snapshot • 11 November 2026, 18:51 GST • MiB / GiB use binary units</text><path d="M60 139H1540" stroke="#A51E37" stroke-width="2"/><rect x="60" y="178" width="800" height="650" rx="13" fill="white" stroke="#DCE1E8"/><text x="86" y="214.0" font-size="13.440000000000001" fill="#627084" font-weight="bold">APPLICATION HOST</text><rect x="88" y="248" width="300" height="114" rx="13" fill="#F7F8FA" stroke="#DCE1E8"/><text x="106" y="282.0" font-size="19.040000000000003" fill="#202B3B" font-weight="bold">Browser</text><text x="106" y="314.0" font-size="12.32" fill="#627084" font-weight="normal">Not attributed in this snapshot</text><text x="106" y="332.15" font-size="12.32" fill="#627084" font-weight="normal">Existing browser processes are shared.</text><rect x="430" y="248" width="400" height="114" rx="13" fill="#F7F8FA" stroke="#DCE1E8"/><text x="450" y="282.0" font-size="19.040000000000003" fill="#202B3B" font-weight="bold">FastAPI backend</text><text x="450" y="324.0" font-size="25.76" fill="#A51E37" font-weight="bold">129.8 MiB</text><text x="647" y="324.0" font-size="12.32" fill="#627084" font-weight="normal">working set</text><path d="M392 305 L425 305" stroke="#9B7380" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="88" y="393" width="300" height="145" rx="13" fill="#F7F8FA" stroke="#DCE1E8"/><text x="106" y="426.0" font-size="16.8" fill="#202B3B" font-weight="bold">Vite development server</text><text x="106" y="470.0" font-size="24.64" fill="#A51E37" font-weight="bold">140.0 MiB</text><text x="106" y="500.0" font-size="12.32" fill="#627084" font-weight="normal">Development only; production</text><text x="106" y="518.15" font-size="12.32" fill="#627084" font-weight="normal">serves the built static files.</text><rect x="430" y="393" width="400" height="145" rx="13" fill="#F7F8FA" stroke="#DCE1E8"/><text x="450" y="425.0" font-size="15.680000000000001" fill="#202B3B" font-weight="bold">Inside the backend working set</text><text x="450" y="459.0" font-size="12.32" fill="#627084" font-weight="normal">Python and libraries • parsed uploads</text><text x="450" y="477.15" font-size="12.32" fill="#627084" font-weight="normal">Prompt text • instruction indexes and caches</text><text x="450" y="495.3" font-size="12.32" fill="#627084" font-weight="normal">Responses • database connections</text><text x="450" y="521.0" font-size="11.200000000000001" fill="#A51E37" font-weight="normal">Dynamic usage; no fixed per-feature split.</text><rect x="88" y="575" width="742" height="211" rx="13" fill="#F7F8FA" stroke="#DCE1E8"/><text x="110" y="613.0" font-size="19.040000000000003" fill="#202B3B" font-weight="bold">LLM and document services</text><text x="110" y="650.0" font-size="13.440000000000001" fill="#627084" font-weight="normal">Cloud / on-premise inference runs on external services.</text><text x="110" y="669.8" font-size="13.440000000000001" fill="#627084" font-weight="normal">Model weights are not loaded into the local FastAPI process.</text><text x="110" y="708.0" font-size="13.440000000000001" fill="#627084" font-weight="normal">Remote Docling memory and the inference server’s CPU/GPU</text><text x="110" y="727.8" font-size="13.440000000000001" fill="#627084" font-weight="normal">memory are outside this local measurement.</text><text x="110" y="764.0" font-size="12.32" fill="#A51E37" font-weight="normal">Upload size and concurrency can raise the backend peak.</text><rect x="892" y="178" width="648" height="650" rx="13" fill="white" stroke="#DCE1E8"/><text x="920" y="214.0" font-size="13.440000000000001" fill="#627084" font-weight="bold">ORACLE DATABASE CONTAINER</text><text x="920" y="279.0" font-size="35.84" fill="#A51E37" font-weight="bold">2.336GiB</text><text x="920" y="309.0" font-size="14.560000000000002" fill="#202B3B" font-weight="bold">Measured Docker memory usage</text><text x="920" y="336.0" font-size="12.32" fill="#627084" font-weight="normal">Includes Oracle plus container overhead.</text><rect x="920" y="367" width="592" height="113" rx="13" fill="#F7F8FA" stroke="#DCE1E8"/><text x="939" y="397.0" font-size="15.680000000000001" fill="#202B3B" font-weight="bold">SGA • shared Oracle memory</text><text x="939" y="434.0" font-size="19.040000000000003" fill="#A51E37" font-weight="bold">Allocated: 1.49 GiB</text><text x="939" y="463.0" font-size="12.32" fill="#627084" font-weight="normal">Target and maximum: 1.50 GiB</text><rect x="920" y="498" width="592" height="134" rx="13" fill="#F7F8FA" stroke="#DCE1E8"/><text x="939" y="528.0" font-size="15.680000000000001" fill="#202B3B" font-weight="bold">PGA • process / session memory</text><text x="939" y="564.0" font-size="19.040000000000003" fill="#A51E37" font-weight="bold">Allocated: 416.8 MiB</text><text x="939" y="592.0" font-size="12.32" fill="#627084" font-weight="normal">Target: 512 MiB (soft) • Aggregate limit: 2 GiB</text><text x="920" y="673.0" font-size="13.440000000000001" fill="#202B3B" font-weight="bold">No hard per-container RAM cap is configured.</text><text x="920" y="700.0" font-size="12.32" fill="#627084" font-weight="normal">Docker reports 14.52 GiB available to its engine.</text><text x="920" y="718.15" font-size="12.32" fill="#627084" font-weight="normal">This is a shared ceiling, not an Oracle reservation.</text><text x="920" y="762.0" font-size="12.32" fill="#A51E37" font-weight="normal">SGA/PGA counters describe allocation, not resident usage.</text><text x="920" y="780.15" font-size="12.32" fill="#A51E37" font-weight="normal">Do not add them again to the Docker memory figure.</text><rect x="60" y="858" width="1480" height="197" rx="13" fill="white" stroke="#DCE1E8"/><text x="86" y="892.0" font-size="14.560000000000002" fill="#202B3B" font-weight="bold">WHOLE COMPUTER • all applications, including Docker</text><text x="1200" y="892.0" font-size="14.560000000000002" fill="#202B3B" font-weight="bold">Total: 29.77 GiB</text><rect x="88" y="925" width="1424" height="24" fill="#DEE4EB"/><rect x="88" y="925" width="1257.3398515125193" height="24" fill="#A51E37"/><text x="88" y="984.0" font-size="15.680000000000001" fill="#A51E37" font-weight="bold">In use / not available: 26.29 GiB</text><text x="1050" y="984.0" font-size="15.680000000000001" fill="#627084" font-weight="bold">Available: 3.48 GiB</text><text x="88" y="1021.0" font-size="12.32" fill="#627084" font-weight="normal">Host and component counters overlap. They must not be summed as separate allocations.</text><text x="62" y="1091.0" font-size="12.32" fill="#627084" font-weight="normal">Process figures average 3 short samples after startup. This is not a load test, peak-capacity guarantee or production sizing recommendation.</text></svg>